<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo de Árbol con D3.js</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="tree-container"></div>
    <script>
      // Datos del árbol
      const data = {
        name: "Garbhodakaśāyī Viṣṇu",
        children: [
          {
            name: "Śrī Brahmā",
            children: [
              { name: "Aṅgirā" },
              {
                name: "Atri",
                children: [{ name: "Nieto 3" }, { name: "Nieto 4" }],
              },
              { name: "Bhṛgu" },
              { name: "Dakṣa" },
              { name: "Kratu" },
              { name: "Marīci" },
              { name: "Nārada (el décimo hijo)" },
              { name: "Pulastya" },
              { name: "Pulaha" },
              { name: "Svāyambhuva Manu y Śatarūpā" },
              { name: "Vasiṣṭha" },
            ],
          },
        ],
      };

      // Función para crear el árbol
      function createTree(data) {
        const width = 928;
        const root = d3.hierarchy(data);
        const dx = 10;
        const dy = width / (root.height + 1);

        const tree = d3.tree().nodeSize([dx, dy]);

        root.sort((a, b) => d3.ascending(a.data.name, b.data.name));
        tree(root);

        let x0 = Infinity;
        let x1 = -x0;
        root.each((d) => {
          if (d.x > x1) x1 = d.x;
          if (d.x < x0) x0 = d.x;
        });

        const height = x1 - x0 + dx * 2;

        const svg = d3
          .create("svg")
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", [-dy / 3, x0 - dx, width, height])
          .attr(
            "style",
            "max-width: 100%; height: auto; font: 10px sans-serif;"
          );

        // Configurar el comportamiento de zoom
        const zoom = d3
          .zoom()
          .scaleExtent([0.5, 2]) // Establece los límites de zoom
          .on("zoom", zoomed);

        // Aplicar el zoom al SVG
        svg.call(zoom);

        // Función que maneja el evento de zoom
        function zoomed(event) {
          svg.attr("transform", event.transform); // Aplica la transformación de zoom
        }

        const link = svg
          .append("g")
          .attr("fill", "none")
          .attr("stroke", "#555")
          .attr("stroke-opacity", 0.4)
          .attr("stroke-width", 1.5)
          .selectAll()
          .data(root.links())
          .join("path")
          .attr(
            "d",
            d3
              .linkHorizontal()
              .x((d) => d.y)
              .y((d) => d.x)
          );

        const node = svg
          .append("g")
          .attr("stroke-linejoin", "round")
          .attr("stroke-width", 3)
          .selectAll()
          .data(root.descendants())
          .join("g")
          .attr("transform", (d) => `translate(${d.y},${d.x})`)
          .on("click", handleClick); // Agregar evento de clic

        node
          .append("circle")
          .attr("fill", (d) => (d.children ? "#555" : "#999"))
          .attr("r", 2.5);

        node
          .append("text")
          .attr("dy", "0.31em")
          .attr("x", (d) => (d.children ? -6 : 6))
          .attr("text-anchor", (d) => (d.children ? "end" : "start"))
          .text((d) => d.data.name)
          .attr("stroke", "white")
          .attr("paint-order", "stroke");

        return svg.node();

        // Función para manejar el clic en un nodo
        function handleClick(event, d) {
          // Alternar entre expandir y colapsar
          if (d.children) {
            console.log(d);
            d._children = d.children; // Almacenar los hijos en _children
            d.children = null; // Colapsar
          } else {
            d.children = d._children; // Restaurar los hijos
            d._children = null; // Limpiar _children
          }

          // Actualizar el árbol
          updateTree(root);
        }

        // Función para actualizar el árbol
        function updateTree(source) {
          // Volver a calcular la posición
          tree(source);

          // Redibujar enlaces
          const link = svg
            .selectAll("path")
            .data(source.links(), (d) => d.target.data.name);

          link
            .enter()
            .append("path")
            .attr("fill", "none")
            .attr("stroke", "#555")
            .attr("stroke-opacity", 0.4)
            .attr("stroke-width", 1.5)
            .merge(link)
            .transition()
            .duration(200)
            .attr(
              "d",
              d3
                .linkHorizontal()
                .x((d) => d.y)
                .y((d) => d.x)
            );

          link.exit().remove();

          // Redibujar nodos
          const node = svg
            .selectAll("g")
            .data(source.descendants(), (d) => d.data.name);

          const nodeEnter = node
            .enter()
            .append("g")
            .attr("transform", (d) => `translate(${d.y},${d.x})`)
            .on("click", handleClick);

          nodeEnter
            .append("circle")
            .attr("fill", (d) => (d.children ? "#555" : "#999"))
            .attr("r", 2.5);

          nodeEnter
            .append("text")
            .attr("dy", "0.31em")
            .attr("x", (d) => (d.children ? -6 : 6))
            .attr("text-anchor", (d) => (d.children ? "end" : "start"))
            .text((d) => d.data.name)
            .attr("stroke", "white")
            .attr("paint-order", "stroke");

          const nodeUpdate = nodeEnter
            .merge(node)
            .transition()
            .duration(200)
            .attr("transform", (d) => `translate(${d.y},${d.x})`);

          nodeUpdate
            .select("circle")
            .attr("fill", (d) => (d.children ? "#555" : "#999"));

          // Actualizar el texto de los nodos
          nodeUpdate.select("text").text((d) => d.data.name); // Asegúrate de que el texto se actualice

          node.exit().remove();
        }
      }

      // Agregar el árbol al contenedor
      const treeContainer = d3.select("#tree-container");
      treeContainer.append(() => createTree(data)); //apend añade elementos
    </script>
  </body>
</html>
